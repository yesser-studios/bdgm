[package]
name = "bdgm"
description = "A library for handling Blu-Ray Disc Game discs"
version = "0.0.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/yesser-studios/bdgm"
readme = "../README.md"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
anyhow = "1"
thiserror = "2"
hadris-udf = { version = "2.1.0", features = ["write"] }
