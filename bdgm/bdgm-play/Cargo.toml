[package]
name = "bdgm-play"
description = "A simple CLI BDGM player"
version = "0.2.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/yesser-studios/bdgm"
readme = "../../README.md"

[dependencies]
bdgm = {version = "0.1", path = ".."}
clap = {version = "4", features = ["derive"]}
anyhow = "1"
thiserror = "2"
platform-dirs = "0.3"
tempfile = "3"
fs_extra = "1"
hadris-udf = { version = "2.1.0" }
webbrowser = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

axum = "0.8"
tokio = { version = "1", features = [ "macros", "rt-multi-thread", "net" ] }
tower-http = { version = "0.6", features = [ "fs" ] }
percent-encoding = "2"

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
bimap = { version = "0.6", features = [ "serde" ] }
