[package]
name = "bdgm-play"
description = "A simple CLI BDGM player"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yesser-studios/bdgm"

[dependencies]
bdgm = {version = "0.0.5", path = ".."}
clap = {version = "4", features = ["derive"]}
anyhow = "1"
thiserror = "2"
platform-dirs = "0.3"
fs_extra = "1"
