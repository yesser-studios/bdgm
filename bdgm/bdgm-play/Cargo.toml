[package]
name = "bdgm-play"
description = "A simple CLI BDGM player"
version = "0.2.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/yesser-studios/bdgm"

[dependencies]
bdgm = {version = "0.0.5", path = ".."}
clap = {version = "4", features = ["derive"]}
anyhow = "1"
thiserror = "2"
platform-dirs = "0.3"
fs_extra = "1"
hadris-udf = { version = "2.1.0" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
